<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- "graphite" variant drawn for the 32 px slot: whole pixels, no seam, 2 px per face pixel. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f47"/><stop offset="1" stop-color="#16191d"/></linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd05a"/><stop offset="1" stop-color="#3f9a36"/></linearGradient>
  </defs>
  <rect x="3" y="3" width="26" height="26" rx="6" fill="url(#tile)"/>
  <rect x="3.5" y="3.5" width="25" height="25" rx="5.5" fill="none" stroke="#ffffff1f"/>
  <rect x="7" y="8" width="18" height="17" rx="5" fill="url(#case)"/>
  <g fill="#0f2412" shape-rendering="crispEdges">
    <rect x="10" y="12" width="2" height="2"/>
    <rect x="12" y="12" width="2" height="2"/>
    <rect x="18" y="12" width="2" height="2"/>
    <rect x="20" y="12" width="2" height="2"/>
    <rect x="10" y="14" width="2" height="2"/>
    <rect x="12" y="14" width="2" height="2"/>
    <rect x="18" y="14" width="2" height="2"/>
    <rect x="20" y="14" width="2" height="2"/>
    <rect x="14" y="16" width="2" height="2"/>
    <rect x="16" y="16" width="2" height="2"/>
    <rect x="12" y="18" width="2" height="2"/>
    <rect x="14" y="18" width="2" height="2"/>
    <rect x="16" y="18" width="2" height="2"/>
    <rect x="18" y="18" width="2" height="2"/>
    <rect x="12" y="20" width="2" height="2"/>
    <rect x="14" y="20" width="2" height="2"/>
    <rect x="16" y="20" width="2" height="2"/>
    <rect x="18" y="20" width="2" height="2"/>
    <rect x="12" y="22" width="2" height="2"/>
    <rect x="18" y="22" width="2" height="2"/>
  </g>
</svg>
